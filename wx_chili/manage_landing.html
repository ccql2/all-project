
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>椒口称赞-防伪溯源管理中心</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            .login-container {
                width: 90%;
                max-width: 400px;
                background-color: #fff;
                padding: 20px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                border-radius: 10px;
                text-align: center;
            }
            h1 {
                color: #333;
                margin-bottom: 20px;
            }
            .form-group {
                margin-bottom: 15px;
                text-align: left;
            }
            .form-group label {
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
            }
            .form-group input {
                width: calc(100% - 20px); /* 减去 padding 的宽度 */
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                font-size: 14px;
                margin: 0 auto; /* 居中 */
            }
            .form-group button {
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 16px;
                cursor: pointer;
            }
            .form-group button:hover {
                background-color: #0056b3;
            }
            .captcha-group {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .captcha-group input {
                flex: 1;
            }
            .captcha-group button {
                width: auto;
                padding: 10px 15px;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <h1>椒口称赞-防伪溯源管理中心</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="phone">账号:</label>
                    <input type="text" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="password">密码:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group captcha-group">
                    <label for="code">验证码:</label>
                    <input type="text" id="code" name="code" required>
                    <button type="button" id="get-code">获取验证码</button>
                </div>
                <div class="form-group">
                    <button type="submit">登录</button>
                </div>
            </form>
        </div>

        <script>
            // 获取验证码按钮点击事件
            document.getElementById('get-code').addEventListener('click', function() {
                alert('验证码已发送（模拟）');
            });

            // 表单提交事件
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.status === 'success') {
                    window.location.href = '/upload_page';
                } else {
                    alert(result.message);
                }
            });
        </script>
    </body>
    </html>
